<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="谢茂宇 XIE MAOYU — 游戏策划/发行运营。爱游戏·懂玩家·会整活。用数据思维撬动快乐。" />
    <meta name="theme-color" content="#0a0a0a" />

    <!-- ====== 强制禁用浏览器缓存 (每次访问都回源取最新部署) ====== -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <title>谢茂宇 · 游戏策划 / 发行运营作品集</title>

    <!-- DNS + 连接预热:首屏关键资源域名尽早完成握手 -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="dns-prefetch" href="https://shared.steamstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://shared.steamstatic.com" crossorigin />

    <!-- 字体:display=swap 避免 FOIT(不可见文字),首屏内容先到 -->
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap&display=swap"
      rel="stylesheet"
    />

    <!-- 首屏预加载关键图:Hero 弧形前 4 张卡,避免图片比文字晚到 -->
    <link rel="preload" as="image" href="https://shared.steamstatic.com/store_item_assets/steam/apps/2424880/library_hero.jpg" />
    <link rel="preload" as="image" href="https://shared.steamstatic.com/store_item_assets/steam/apps/2211020/library_hero.jpg" />
    <link rel="preload" as="image" href="/images/games/genshin.jpg" />
    <link rel="preload" as="image" href="https://shared.steamstatic.com/store_item_assets/steam/apps/730/library_hero.jpg" />

    <!-- ====== 安全覆盖:强制 contain:content, 防止 CSS 里 contain:strict 导致模块塌陷 ====== -->
    <style>
      .dot-grid, .dot-grid-dark { contain: content !important; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
